listen 1935;
max_connections 1000;
daemon off;

# HTTP API untuk monitoring
http_api {
    enabled on;
    listen 1985;
}

# HTTP Server untuk FLV streaming
http_server {
    enabled on;
    listen 8081;
    dir ./objs/nginx/html;
}

# WebRTC Server
rtc_server {
    enabled off;
    # listen 8000; 
    # candidate $CANDIDATE;
}
vhost __defaultVhost__ {
    # HTTP Callback untuk notifikasi event stream ke Flask backend
    http_hooks {
        enabled on;
        on_publish http://127.0.0.1:8080/api/srs/on_publish;
        on_unpublish http://127.0.0.1:8080/api/srs/on_unpublish;
    }

    mw_latency off;
    
    # HLS dimatikan untuk mengurangi latency
    hls {
        enabled off;
    }

    # HTTP FLV Remux untuk streaming via browser
    http_remux {
        enabled on;
        mount [vhost]/[app]/[stream].flv;
    }

    # WebRTC Configuration
    rtc {
        enabled	off;
        # rtmp_to_rtc on;
        # rtc_to_rtmp off;
        # bframe discard;
    }

    # Play Configuration untuk mengurangi buffer
    play{
        gop_cache off;
        queue_length 10;
    }
}
