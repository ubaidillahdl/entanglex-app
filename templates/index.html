<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EntangleX</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/favicon.png') }}" />
    <!-- Static Assets: CSS Stylesheet & JS -->
    <link rel="stylesheet" href="/static/css/output.css" />
    <script src="/static/js/mpegts.min.js"></script>
  </head>
  <body class="w-full min-h-screen bg-slate-900 text-slate-100 font-mono flex justify-center items-center p-4">
    <!-- Main Card Wrapper -->
    <div class="w-11/12 max-w-7xl bg-slate-800/80 border border-slate-700/80 p-6 md:p-8 shadow-2xl rounded-2xl backdrop-blur-md">
      <!-- BRANDING HEADER -->
      <div class="flex items-center justify-between border-b border-slate-700/80 pb-4 mb-6">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-cyan-500/20 border border-cyan-400/40 flex items-center justify-center text-cyan-300 font-bold text-base shadow-sm overflow-hidden p-1">
            <img src="{{ url_for('static', filename='assets/favicon.png') }}" alt="Logo" class="w-full h-full object-contain" />
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-wide text-white flex items-center gap-2">EntangleX</h1>
          </div>
        </div>
      </div>

      <!-- MAIN GRID CONTAINER -->
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">
        <!-- LEFT COLUMN: Video Player -->
        <div class="lg:col-span-3 relative w-full aspect-video bg-black rounded-xl overflow-hidden border border-slate-700 shadow-xl">
          <!-- No Signal Overlay -->
          <div id="no-signal-text" class="absolute inset-0 flex items-center justify-center bg-slate-950/90 text-cyan-400 text-xs sm:text-sm md:text-base font-semibold animate-pulse z-10 pointer-events-none">Waiting for live stream...</div>
          <!-- Video Element -->
          <video id="videoElement" class="absolute inset-0 w-full h-full object-cover z-0" controls muted autoplay></video>
        </div>

        <!-- RIGHT COLUMN: Telemetry Panel -->
        <div class="lg:col-span-1 space-y-3">
          <!-- Status Badge -->
          <div id="status-badge" class="w-full text-center py-2 px-4 rounded-xl text-xs font-bold transition-all bg-rose-500/20 text-rose-300 border border-rose-500/40 shadow-sm">Offline</div>

          <!-- Metrics List -->
          <div class="bg-slate-900/80 border border-slate-700/70 rounded-xl p-4 space-y-3 shadow-inner">
            <div class="text-xs font-bold text-slate-400 border-b border-slate-700/70 pb-2 flex items-center justify-between">
              <span>Stream Telemetry</span>
              <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
            </div>

            <ul class="space-y-2.5 text-xs">
              <li class="flex justify-between items-center border-b border-slate-800 pb-2">
                <span class="text-slate-400 font-medium text-[11px]">Target Stream</span>
                <span id="stream-name" class="font-bold text-cyan-300 text-sm truncate max-w-37.5 text-right">-</span>
              </li>

              <li class="flex justify-between items-center border-b border-slate-800 pb-2">
                <span class="text-slate-400 font-medium text-[11px]">Bitrate</span>
                <span id="bitrate" class="font-bold text-amber-300 text-sm text-right">0 Kbps</span>
              </li>

              <li class="flex justify-between items-center border-b border-slate-800 pb-2">
                <span class="text-slate-400 font-medium text-[11px]">FPS</span>
                <span id="fps" class="font-bold text-emerald-300 text-sm text-right">0</span>
              </li>

              <li class="flex justify-between items-center border-b border-slate-800 pb-2">
                <span class="text-slate-400 font-medium text-[11px]">Resolution</span>
                <span id="resolution" class="font-bold text-slate-200 text-xs text-right">-</span>
              </li>

              <li class="flex justify-between items-center border-b border-slate-800 pb-2">
                <span class="text-slate-400 font-medium text-[11px]">Video Codec</span>
                <span id="v-codec" class="font-semibold text-slate-300 text-xs truncate max-w-37.5 text-right">-</span>
              </li>

              <li class="flex justify-between items-center border-b border-slate-800 pb-2">
                <span class="text-slate-400 font-medium text-[11px]">Audio Codec</span>
                <span id="a-codec" class="font-semibold text-slate-300 text-xs truncate max-w-37.5 text-right">-</span>
              </li>

              <li class="flex justify-between items-center border-b border-slate-800 pb-2">
                <span class="text-slate-400 font-medium text-[11px]">Stream Uptime</span>
                <span id="uptime" class="font-semibold text-indigo-300 text-xs truncate max-w-37.5 text-right">-</span>
              </li>

              <li class="flex justify-between items-center pt-0.5">
                <span class="text-slate-400 font-medium text-[11px]">Client CID</span>
                <span id="client-ip" class="font-semibold text-slate-400 text-xs truncate max-w-37.5 text-right">-</span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <!-- Main JavaScript Logic -->
    <script src="/static/js/main.js"></script>
  </body>
</html>
